# Documentation-only example. The application reads process environment variables.
TELEGRAM_BOT_TOKEN=change_me
TELEGRAM_BOT_USERNAME=ExampleBot
TELEGRAM_ADMIN_CHAT_ID=-1000000000000
MODERATOR_TELEGRAM_IDS=123456789
AUTH_DATABASE_PATH=./data/auth-backend.db
HOW_TO_PLAY_URL=https://t.me/example/1
TELEGRAM_FEATURE_CONFIG_PATH=./config/telegram-features.yaml
HTTP_BIND_ADDRESS=127.0.0.1
HTTP_PORT=8080
AUTH_API_TOKEN=replace_with_at_least_32_random_characters
DEVICE_FINGERPRINT_SECRET=replace_with_a_separate_random_secret_of_at_least_32_characters
SERVER_ID=survival-main
# Device observations are enabled by default. Strong-signal weights are centralized in BackendConfig.
# Retention is documented as 365 days; automatic cleanup is intentionally deferred in 0.6.5.
DEVICE_FINGERPRINT_ENABLED=true
DEVICE_FINGERPRINT_VERSION=1
DEVICE_OBSERVATION_RETENTION_DAYS=365
DEVICE_BAN_ENABLED=true
ADMIN_LOCALE=en
DEFAULT_USER_LOCALE=en
