# UTF-8, non-secret Telegram feature configuration. Loaded once at backend startup.
howToPlay:
  en: |
    Replace this text with your English server instructions.
  ru: |
    Замените этот текст инструкцией вашего сервера на русском языке.

registration:
  subscriptionCheck:
    enabled: false
    channel: "@example_channel"
    channelUrl: "https://t.me/example_channel"

serverMap:
  enabled: false
  url: "https://map.example.com/"

modpackDownload:
  enabled: false
  url: "https://t.me/example_channel/123"

serverStatus:
  enabled: true
  heartbeatTimeoutSeconds: 60
  showPlayerCount: true
  showPlayerList: true
  showSessionDuration: true

# Requires Bot API 9.5+, bot administrator rights, and can_manage_tags.
memberTags:
  enabled: false
  chatId: <TELEGRAM_GROUP_CHAT_ID>
  excludeChatAdministrators: true
